<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
</head>
<body>
    <h1>My Image Gallery</h1>
    <div class="gallery">
        <img id="mainImage" src="images/image1.jpeg" alt="Main image">
         <div class="thumbnails">
        <img class="thumbnail" data-src="images/image1.jpeg" src="images/image1.jpeg" alt="Image 1">

        <img class="thumbnail" data-src="images/image2.jpeg" src="images/image2.jpeg" alt="Image 2">

        <img class="thumbnail" data-src="images/image3.jpeg" src="images/image3.jpeg" alt="Image 3">
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
