<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
</head>
<body>
    <h1>Character Counter</h1>
    <textarea id="textInput" maxlength="100" placeholder="Type something..."></textarea>
    <p id="count">0 / 100 characters</p>
    <p id="remaining">100 characters remaining</p>
    <p id="warning"></p>
    <script src="script.js"></script>
</body>
</html>
