<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search and Filter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Programming Languages</h1>

      <input type="text" id="searchInput" placeholder="Search languages..." />

      <ul id="languageList">
        <li>JavaScript</li>
        <li>Java</li>
        <li>Python</li>
        <li>C++</li>
        <li>PHP</li>
        <li>Ruby</li>
        <li>TypeScript</li>
        <li>Go</li>
      </ul>

      <p id="noResults">No matching languages found.</p>
    </main>
  </body>
</html>
