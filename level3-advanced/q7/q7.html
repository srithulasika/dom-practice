<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>My Shopping Store</h1>

      <!-- Products Section -->
      <section class="products">
        <h2>Products</h2>

        <div class="product-list">
          <div class="product">
            <h3>Notebook</h3>
            <p>Price: ₹100</p>
            <button class="add-btn" data-id="1">Add to Cart</button>
          </div>

          <div class="product">
            <h3>Pen</h3>
            <p>Price: ₹20</p>
            <button class="add-btn" data-id="2">Add to Cart</button>
          </div>

          <div class="product">
            <h3>Backpack</h3>
            <p>Price: ₹800</p>
            <button class="add-btn" data-id="3">Add to Cart</button>
          </div>
        </div>
      </section>

      <!-- Shopping Cart Section -->
      <section class="cart">
        <h2>Shopping Cart (<span id="cartCount">0</span> items)</h2>

        <p class="product-count">
          Different products:
          <span id="productCount">0</span>
        </p>

        <div id="cartItems"></div>

        <h3 id="total">Total: ₹0</h3>
      </section>
    </main>
  </body>
</html>
